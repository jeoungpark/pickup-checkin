<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>픽업 체크인 · 탑승자 링크</title>
<style>
body{font-family:-apple-system,'Apple SD Gothic Neo','Noto Sans KR',system-ui,sans-serif;max-width:640px;margin:32px auto;padding:0 16px;color:#111418;background:#f4f6f8}
@media (prefers-color-scheme:dark){body{color:#eef1f3;background:#0f1214}a{color:#90caf9}}
h1{font-size:22px}p{color:#5f6b76}li{margin:10px 0;font-size:18px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px;margin-top:20px}
iframe{width:100%;height:640px;border:1px solid #c9d1d9;border-radius:24px;background:#fff}
</style></head>
<body>
<h1 id="t">픽업 체크인</h1>
<p>차량 앱이 픽업을 시작하면 탑승자별 링크가 생겨요. 아래는 발표용으로 모든 탑승자 화면을 나란히 보여줍니다.</p>
<ul id="links"></ul>
<div class="grid" id="grid"></div>
<script>
let shown='';
async function load(){
  const {plan} = await (await fetch('/api/state?after=999999',{cache:'no-store'})).json();
  if(!plan) return;
  const ids = plan.stops.flatMap(s=>s.riders.map(r=>[r.id,r.name,s.place]));
  const key = ids.map(x=>x[0]).join(',');
  if(key===shown) return; shown=key;
  document.getElementById('t').textContent = plan.title;
  document.getElementById('links').innerHTML = ids.map(([id,n,p])=>`<li><a href="/r/${id}">${n}</a> · ${p}</li>`).join('');
  document.getElementById('grid').innerHTML = ids.map(([id])=>`<iframe src="/r/${id}"></iframe>`).join('');
}
load(); setInterval(load, 2000);
</script>
</body></html>
